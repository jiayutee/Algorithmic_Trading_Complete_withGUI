name: CI – pytest

# Run on every push to main and on all pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run pytest (non-GUI)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ────────────────────────────────────────────
      # requirements.txt contains platform-specific and heavy packages
      # (PyQt5, PyQtWebEngine, tensorflow, torch, finrl) that cannot be
      # installed on a headless Ubuntu runner.  We install only the subset
      # needed for non-GUI tests, then allow optional heavy packages to fail
      # silently so the step always succeeds.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core packages needed by all non-GUI tests
          pip install \
            yfinance pandas numpy scikit-learn \
            ta backtrader \
            requests python-dotenv \
            newsapi-python beautifulsoup4 \
            matplotlib plotly scipy statsmodels \
            joblib pytest ccxt websocket-client \
            "dash>=2.16,<3" "dash-bootstrap-components>=1.5,<2"
          # Optional packages — allowed to fail on CI
          pip install pandas-ta stable-baselines3 openbb openbb-yfinance || true

      # ── 4. Run tests ────────────────────────────────────────────────────────
      # GUI tests (test_gui.py) require a real Qt display and PyQtChart, which
      # are not available in the headless Ubuntu runner.  They are excluded here
      # with --ignore.  All other test files are collected and run.
      #
      # API keys are NOT required: tests mock external calls.  If secrets are
      # added to the repository later they can be passed via ${{ secrets.X }}.
      - name: Run pytest (excluding GUI tests)
        run: |
          python -m pytest \
            --ignore=test_gui.py \
            --tb=short \
            -v
