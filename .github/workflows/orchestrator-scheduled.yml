name: Orchestrator – Scheduled

# SGT = UTC+8
# 6am  SGT = 22:00 UTC (previous day)
# 12pm SGT = 04:00 UTC
# 8pm  SGT = 12:00 UTC
on:
  schedule:
    - cron: "0 22 * * 0-4"   # 6am SGT Mon–Fri (morning brief)
    - cron: "0 4  * * 1-5"   # 12pm SGT Mon–Fri (midday pulse)
    - cron: "0 12 * * 1-5"   # 8pm SGT Mon–Fri (EOD debrief)
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which cycle to run"
        required: true
        default: "morning"
        type: choice
        options: [morning, midday, evening, task]
      task_prompt:
        description: "Custom task prompt (only used when run_type=task)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  orchestrate:
    name: Orchestrator (${{ github.event.inputs.run_type || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet || true

      - name: Determine run type from schedule
        id: run_type
        run: |
          if [ -n "${{ github.event.inputs.run_type }}" ]; then
            echo "type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "22" ] || [ "$HOUR" = "23" ]; then
              echo "type=morning" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" = "04" ] || [ "$HOUR" = "05" ]; then
              echo "type=midday" >> "$GITHUB_OUTPUT"
            else
              echo "type=evening" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build prompt
        id: prompt
        run: |
          TYPE="${{ steps.run_type.outputs.type }}"
          CUSTOM="${{ github.event.inputs.task_prompt }}"
          DAYS=$(python3 -c "from datetime import date; print((date(2026,7,28)-date.today()).days)" 2>/dev/null || echo "?")
          DAY_N=$(python3 -c "from datetime import date; print(max(1, 30-(date(2026,7,28)-date.today()).days+1))" 2>/dev/null || echo "?")

          if [ "$TYPE" = "morning" ]; then
            PROMPT="RUN_TYPE=morning. This is the 6am SGT morning brief for Day ${DAY_N}/30 of the AlgoTrader launch sprint (${DAYS} days to launch on 2026-07-28). Follow the Morning Brief procedure in your agent definition exactly: read yesterday's carry-forwards from Notion, plan today's agenda, assign tasks to specialist agents, create today's Daily Log row, add Sprint Board tasks, send the Telegram morning brief, then spawn the specialist agents."
          elif [ "$TYPE" = "midday" ]; then
            PROMPT="RUN_TYPE=midday. This is the 12pm SGT midday pulse for Day ${DAY_N}/30. Follow the Midday Pulse procedure: check Sprint Board progress, update the Daily Log Midday Update field, triage any blocked tasks, send the Telegram midday update."
          elif [ "$TYPE" = "evening" ]; then
            PROMPT="RUN_TYPE=evening. This is the 8pm SGT EOD debrief for Day ${DAY_N}/30. Follow the Evening Debrief procedure: collect agent outcomes, update Issue Tracker for any blockers, update today's Daily Log (Done Today, Blockers, Carry Forward, Commits, Status→Done), update the Launch Roadmap checklist percentages, update Agent Status Board, send the Telegram EOD debrief."
          elif [ -n "$CUSTOM" ]; then
            PROMPT="RUN_TYPE=task. $CUSTOM"
          else
            PROMPT="RUN_TYPE=task. Review the current project state, check for any open issues or failing tests, and produce a status report."
          fi
          echo "text=$PROMPT" >> "$GITHUB_OUTPUT"

      - name: Run Orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          OPENBB_NEWS_PROVIDER: "yfinance"
          OPENBB_EQUITY_PROVIDER: "yfinance"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          claude \
            --agent orchestrator \
            --non-interactive \
            --output-format json \
            --max-turns 80 \
            -p "${{ steps.prompt.outputs.text }}" \
            2>&1 | tee orchestrator-output.json

      - name: Post GitHub Actions summary
        if: always()
        run: |
          TYPE="${{ steps.run_type.outputs.type }}"
          echo "## Orchestrator — ${TYPE} run — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          if [ -f orchestrator-output.json ]; then
            python3 -c "
          import json
          try:
              data = json.load(open('orchestrator-output.json'))
              msgs = data.get('messages', [])
              for m in reversed(msgs):
                  if m.get('role') == 'assistant':
                      content = m.get('content', '')
                      if isinstance(content, list):
                          content = ' '.join(b.get('text','') for b in content if b.get('type')=='text')
                      print(content[:6000])
                      break
          except Exception as e:
              print(f'Parse error: {e}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || tail -80 orchestrator-output.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-${{ steps.run_type.outputs.type }}-${{ github.run_id }}
          path: orchestrator-output.json
          retention-days: 30
