name: Orchestrator – Scheduled

# Timezone: Europe/Berlin
# Summer (CEST, UTC+2) — active Mar–Oct: subtract 2h to get UTC
# Winter (CET,  UTC+1) — active Oct–Mar: subtract 1h to get UTC
#
# Current schedule (CEST / summer):
# 6am  Berlin = 04:00 UTC — morning brief
# 8am  Berlin = 06:00 UTC — progress update
# 10am Berlin = 08:00 UTC — progress update
# 12pm Berlin = 10:00 UTC — progress update
# 2pm  Berlin = 12:00 UTC — progress update
# 4pm  Berlin = 14:00 UTC — progress update
# 6pm  Berlin = 16:00 UTC — progress update
# 8pm  Berlin = 18:00 UTC — EOD debrief
#
# When clocks go back (last Sun Oct): add 1h to each UTC value above.
on:
  # Schedules disabled — orchestrator runs locally via Mac launchd (see scripts/orchestrator-local.sh)
  # To re-enable GitHub Actions scheduling, uncomment the cron lines below and add ANTHROPIC_API_KEY secret.
  # schedule:
  #   - cron: "0 4  * * 1-5"   # 6am  Berlin (CEST) — morning brief
  #   - cron: "0 6  * * 1-5"   # 8am  Berlin (CEST) — progress update
  #   - cron: "0 8  * * 1-5"   # 10am Berlin (CEST) — progress update
  #   - cron: "0 10 * * 1-5"   # 12pm Berlin (CEST) — progress update
  #   - cron: "0 12 * * 1-5"   # 2pm  Berlin (CEST) — progress update
  #   - cron: "0 14 * * 1-5"   # 4pm  Berlin (CEST) — progress update
  #   - cron: "0 16 * * 1-5"   # 6pm  Berlin (CEST) — progress update
  #   - cron: "0 18 * * 1-5"   # 8pm  Berlin (CEST) — EOD debrief
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which cycle to run"
        required: true
        default: "morning"
        type: choice
        options: [morning, progress, evening, task]
      task_prompt:
        description: "Custom task prompt (only used when run_type=task)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  orchestrate:
    name: Orchestrator (${{ github.event.inputs.run_type || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet || true

      - name: Determine run type from schedule
        id: run_type
        run: |
          if [ -n "${{ github.event.inputs.run_type }}" ]; then
            echo "type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            case "$HOUR" in
              4|04) echo "type=morning"   >> "$GITHUB_OUTPUT" ;;  # 6am Berlin (CEST)
              18)   echo "type=evening"   >> "$GITHUB_OUTPUT" ;;  # 8pm Berlin (CEST)
              *)    echo "type=progress"  >> "$GITHUB_OUTPUT" ;;  # 8am–6pm 2h slots
            esac
          fi

      - name: Build prompt
        id: prompt
        run: |
          TYPE="${{ steps.run_type.outputs.type }}"
          CUSTOM="${{ github.event.inputs.task_prompt }}"
          DAYS=$(python3 -c "from datetime import date; print((date(2026,7,28)-date.today()).days)" 2>/dev/null || echo "?")
          DAY_N=$(python3 -c "from datetime import date; print(max(1, 30-(date(2026,7,28)-date.today()).days+1))" 2>/dev/null || echo "?")

          LOCAL_HOUR=$(python3 -c "from datetime import datetime, timezone; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('Europe/Berlin')).strftime('%I:%M%p'))" 2>/dev/null || echo "?")

          if [ "$TYPE" = "morning" ]; then
            PROMPT="RUN_TYPE=morning. 6am SGT morning brief for Day ${DAY_N}/30 (${DAYS} days to launch). Follow the Morning Brief procedure: read yesterday's Notion carry-forwards, plan today's agenda, assign tasks to specialist agents, create today's Daily Log row, add Sprint Board tasks, send Telegram morning brief, then spawn specialist agents."
          elif [ "$TYPE" = "progress" ]; then
            PROMPT="RUN_TYPE=progress. ${LOCAL_HOUR} Berlin progress update for Day ${DAY_N}/30. Check the Sprint Board for task statuses (Done/In Progress/Blocked). Triage any newly blocked tasks. Send a concise Telegram progress message in this format: '⏱ AlgoTrader ${LOCAL_HOUR} update | Day ${DAY_N}/30\n✅ Done: N | 🔄 In progress: N | 🔴 Blocked: N\n<one sentence on biggest risk or win>'. Update Notion Daily Log only if there is something new to report."
          elif [ "$TYPE" = "evening" ]; then
            PROMPT="RUN_TYPE=evening. 8pm SGT EOD debrief for Day ${DAY_N}/30. Follow the Evening Debrief procedure: collect agent outcomes from Sprint Board, update Issue Tracker for blockers, update today's Daily Log (Done Today, Blockers, Carry Forward, Commits, Status→Done), update Launch Roadmap checklist percentages, update Agent Status Board, send Telegram EOD debrief."
          elif [ -n "$CUSTOM" ]; then
            PROMPT="RUN_TYPE=task. $CUSTOM"
          else
            PROMPT="RUN_TYPE=task. Review the current project state, check for any open issues or failing tests, and produce a status report."
          fi
          echo "text=$PROMPT" >> "$GITHUB_OUTPUT"

      - name: Run Orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "51218456"
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          OPENBB_NEWS_PROVIDER: "yfinance"
          OPENBB_EQUITY_PROVIDER: "yfinance"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          claude \
            --agent orchestrator \
            --print \
            --output-format json \
            --max-turns 80 \
            -p "${{ steps.prompt.outputs.text }}" \
            2>&1 | tee orchestrator-output.json

      - name: Post GitHub Actions summary
        if: always()
        run: |
          TYPE="${{ steps.run_type.outputs.type }}"
          echo "## Orchestrator — ${TYPE} run — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          if [ -f orchestrator-output.json ]; then
            python3 -c "
          import json
          try:
              data = json.load(open('orchestrator-output.json'))
              msgs = data.get('messages', [])
              for m in reversed(msgs):
                  if m.get('role') == 'assistant':
                      content = m.get('content', '')
                      if isinstance(content, list):
                          content = ' '.join(b.get('text','') for b in content if b.get('type')=='text')
                      print(content[:6000])
                      break
          except Exception as e:
              print(f'Parse error: {e}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || tail -80 orchestrator-output.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-${{ steps.run_type.outputs.type }}-${{ github.run_id }}
          path: orchestrator-output.json
          retention-days: 30
