name: Orchestrator – Scheduled Run

on:
  schedule:
    # Runs every day at 08:00 UTC (4am ET / 9am SGT).
    # Adjust the cron expression to match your preferred schedule:
    #   "0 8 * * 1-5"  → weekdays only at 08:00 UTC
    #   "0 */6 * * *"  → every 6 hours
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Override prompt sent to orchestrator (leave blank for default)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  orchestrate:
    name: Run Orchestrator Agent
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet || true

      - name: Build orchestrator prompt
        id: prompt
        run: |
          OVERRIDE="${{ github.event.inputs.prompt }}"
          if [ -n "$OVERRIDE" ]; then
            echo "text=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            PROMPT="Perform the daily orchestration run for the Algorithmic Trading project. Review recent git log (last 24 hours), identify any failing tests or open issues, check that all agents (data-pipeline, strategy, execution-broker, backtest-metrics, ui, qa-test, reliability-release) are in a healthy state, flag anything that needs human review, and produce a concise status report. Only ask for human input if something is genuinely unclear or blocked."
            echo "text=$PROMPT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Orchestrator via Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          OPENBB_NEWS_PROVIDER: "yfinance"
          OPENBB_EQUITY_PROVIDER: "yfinance"
          # Let the orchestrator create PRs/issues if needed
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude \
            --agent orchestrator \
            --non-interactive \
            --output-format json \
            --max-turns 50 \
            -p "${{ steps.prompt.outputs.text }}" \
            2>&1 | tee orchestrator-output.json

      - name: Post summary to job summary
        if: always()
        run: |
          echo "## Orchestrator Run — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f orchestrator-output.json ]; then
            # Extract the last assistant message as the summary
            python3 -c "
          import json, sys
          try:
              data = json.load(open('orchestrator-output.json'))
              msgs = data.get('messages', [])
              for m in reversed(msgs):
                  if m.get('role') == 'assistant':
                      content = m.get('content', '')
                      if isinstance(content, list):
                          content = ' '.join(b.get('text','') for b in content if b.get('type')=='text')
                      print(content[:4000])
                      break
          except Exception as e:
              print(f'Could not parse output: {e}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat orchestrator-output.json | tail -50 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No output file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload orchestrator output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-output-${{ github.run_id }}
          path: orchestrator-output.json
          retention-days: 14
